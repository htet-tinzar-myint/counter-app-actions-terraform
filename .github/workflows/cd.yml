# CD: main へのマージ（push）で実行（クラウド不要）
#   1. 2つのイメージをビルドし、起動してスモークテスト
#   2. 承認（production 環境）後に GitHub Container Registry（ghcr.io）へ push
#      タグはコミット SHA と latest
name: CD

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "scripts/smoke_test.py"
      - "scripts/capture.py"
      - "docker-compose.yml"
      - ".github/workflows/cd.yml"
  workflow_dispatch:

permissions:
  contents: read

# 公開が同時に走らないようにする
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docker-compose.yml でビルドし、dashboard(:9002) → counting(:9003) の構成で起動
      - name: Build & run both services
        run: docker compose up -d --build

      - name: Smoke test
        run: |
          pip install websocket-client
          python scripts/smoke_test.py http://localhost:9002

      - name: Show logs on failure
        if: failure()
        run: docker compose logs || true

      # dashboard → counting-service の動作を記録（受け取った count の表を Summary に、画面・ログをアーティファクトに）
      - name: Capture dashboard → counting
        if: success() || failure()
        run: |
          pip install websocket-client playwright
          python -m playwright install --with-deps chromium
          python scripts/capture.py http://localhost:9002

      - name: Save container logs
        if: always()
        run: |
          mkdir -p capture
          docker compose logs --no-color --timestamps > capture/compose-logs.txt || true

      - name: Upload capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-capture
          path: capture/
          retention-days: 14
          if-no-files-found: warn

  publish:
    name: Publish (${{ matrix.service }})
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write # ghcr.io へ push するため（GITHUB_TOKEN を使うので PAT 不要）
    strategy:
      matrix:
        service: [counting-service, dashboard-service]
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Build & push
        env:
          REGISTRY: ${{ vars.IMAGE_REGISTRY || 'ghcr.io' }}
        run: |
          # イメージ名は小文字のみ
          image="$REGISTRY/${GITHUB_REPOSITORY,,}/${{ matrix.service }}"
          docker build \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            -t "$image:${GITHUB_SHA}" -t "$image:latest" \
            services/${{ matrix.service }}
          docker push "$image:${GITHUB_SHA}"
          docker push "$image:latest"
          echo "Published: \`$image:${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
