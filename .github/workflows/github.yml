# GitHub Settings: リポジトリ設定（infra/github）を Terraform で管理（クラウド不要）
#   PR 時       : terraform plan（GitHub に何が反映されるかを確認）
#   main 反映時 : 承認（production 環境）後に terraform apply
# GitHub への認証はシークレット GH_ADMIN_TOKEN（リポジトリ管理権限を持つ PAT）。
# state は暗号化して tfstate ブランチに保存する（scripts/tfstate.sh、パスフレーズは TF_STATE_PASSPHRASE）
name: GitHub Settings

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/github/**"
      - "scripts/tfstate.sh"
      - ".github/workflows/github.yml"
  push:
    branches: [main]
    paths:
      - "infra/github/**"
      - "scripts/tfstate.sh"
      - ".github/workflows/github.yml"
  workflow_dispatch:

permissions:
  contents: read

# apply（state の書き込み）が同時に走らないようにする
concurrency:
  group: github-settings-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.1"

jobs:
  plan:
    name: GitHub settings plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Restore state
        run: bash scripts/tfstate.sh pull infra/github

      - name: init / validate / plan
        working-directory: infra/github
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::シークレット GH_ADMIN_TOKEN が未登録です（README 参照）"
            exit 1
          fi
          terraform init -input=false
          terraform validate
          terraform plan -input=false -lock=false -no-color | tee plan.txt
          {
            echo "### GitHub settings plan"
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: GitHub settings apply
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # tfstate ブランチへ state を push するため
    env:
      GITHUB_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
      TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Restore state
        run: bash scripts/tfstate.sh pull infra/github

      - name: terraform apply
        id: apply
        working-directory: infra/github
        run: |
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::error::シークレット GH_ADMIN_TOKEN が未登録です（README 参照）"
            exit 1
          fi
          terraform init -input=false
          terraform apply -input=false -auto-approve

      # apply が途中で失敗しても、作成済みのリソースを state に残すため必ず保存する
      - name: Save state
        if: always() && steps.apply.outcome != 'skipped'
        run: bash scripts/tfstate.sh push infra/github
